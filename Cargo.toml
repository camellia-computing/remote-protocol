[package]
name = "camellia-remote-protocol"
version = "0.1.0"
authors = ["Camellia Computing", "RustDesk contributors"]
edition = "2021"
rust-version = "1.97"
description = "Shared protocol, transport, configuration, and file-transfer contracts for Camellia Remote"
license = "AGPL-3.0-only"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
flexi_logger = { version = "0.27", features = ["async"] }
protobuf = { version = "3.7", features = ["with-bytes"] }
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
bytes = { version = "1.10", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
socket2 = { version = "0.3", features = ["reuseport"] }
zstd = "0.13"
anyhow = "1.0"
futures-util = "0.3"
directories-next = "2.0"
rand = "0.8"
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
confy = { git = "https://github.com/rustdesk-org/confy", rev = "83db9ec19a2f97e9718aef69e4fc5611bb382479" }
dirs-next = "2.0"
filetime = "0.2"
crypto_box = "0.9.1"
crypto_secretbox = "0.1.1"
ed25519-dalek = "3.0.0"
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["derive"] }
regex = "1.11"
tokio-socks = { git = "https://github.com/rustdesk-org/tokio-socks", rev = "bdb9aa3de5bac41602d0742b8ef6bbc6bfebd127" }
chrono = "0.4"
backtrace = "0.3"
libc = "0.2"
toml = "0.7"
uuid = { version = "1.16", features = ["v4"] }
# new sysinfo issue: https://github.com/rustdesk/rustdesk/pull/6330#issuecomment-2270871442
sysinfo = { git = "https://github.com/rustdesk-org/sysinfo", rev = "90b1705d909a4902dbbbdea37ee64db17841077d" }
thiserror = "1.0"
httparse = "1.10"
base64 = "0.22"
url = "2.5"
sha2 = "0.11"
whoami = "1.5"

tokio-rustls = { version = "0.26", features = [
    "logging",
    "tls12",
    "ring",
], default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls-platform-verifier = "0.6"
rustls-pki-types = "1.11"
rustls-native-certs = "0.8"
webpki-roots = "1.0.4"
libloading = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mac_address = "1.1"
default_net = { git = "https://github.com/rustdesk-org/default_net", rev = "78f8f70cd85151a3a2c4a3230d80d5272703c02e" }
machine-uid = "0.6.0"

[build-dependencies]
protobuf-codegen = { version = "3.7" }

[dev-dependencies]
clap = "4.5.51"
hex-literal = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "synchapi",
    "pdh",
    "memoryapi",
    "sysinfoapi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
osascript = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false, features = [
    "calloop",
] }
users = { package = "uzers", version = "0.12.2", default-features = false }
x11 = "2.21"
