name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Provenance
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s SOURCE_PROVENANCE.json
          python3 -m json.tool SOURCE_PROVENANCE.json >/dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features

  macos-quality:
    name: macOS quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Check Apple-specific code
        run: cargo check --locked --all-targets --all-features

  required:
    name: CI / Required
    if: always()
    needs:
      - dependency-review
      - automation
      - macos-quality
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          MACOS_QUALITY_RESULT: ${{ needs.macos-quality.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          [[ "$AUTOMATION_RESULT" == success ]] || {
            echo "Automation must succeed, got: $AUTOMATION_RESULT" >&2
            exit 1
          }
          [[ "$QUALITY_RESULT" == success ]] || {
            echo "Quality must succeed, got: $QUALITY_RESULT" >&2
            exit 1
          }
          [[ "$MACOS_QUALITY_RESULT" == success ]] || {
            echo "macOS quality must succeed, got: $MACOS_QUALITY_RESULT" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == success ]] || {
              echo "Dependency review must succeed, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == skipped ]] || {
              echo "Dependency review must be skipped outside pull requests, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          fi
