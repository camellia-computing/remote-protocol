name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  automation:
    name: Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Provenance
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s SOURCE_PROVENANCE.json
          python3 -m json.tool SOURCE_PROVENANCE.json >/dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features

  macos-quality:
    name: macOS quality
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Check Apple-specific code
        run: cargo check --locked --all-targets --all-features

  performance-smoke:
    name: Performance contract smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout exact control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Install exact toolchain
        run: rustup toolchain install --no-self-update
        working-directory: candidate
      - name: Validate performance contract
        run: python3 -m unittest -v tools.test_performance_contract
        working-directory: candidate
      - name: Build control and candidate observations
        env:
          CAMELLIA_PERFORMANCE_WORK_SECONDS: ${{ github.event_name == 'push' && '5' || '' }}
          CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTROL_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PERFORMANCE_ITERATIONS: ${{ github.event_name == 'pull_request' && '5' || '15' }}
          PERFORMANCE_POLICY: ${{ github.event_name == 'pull_request' && 'performance/protocol-error-envelope-v1.json' || 'performance/protocol-error-envelope-v1.scheduled.json' }}
          PERFORMANCE_TIER: ${{ github.event_name == 'pull_request' && 'pr-smoke' || 'scheduled' }}
        run: |
          install -m 0644 \
            candidate/examples/performance_observation.rs \
            control/examples/performance_observation.rs
          CARGO_TARGET_DIR="$RUNNER_TEMP/control-target" \
            cargo build --locked --release --example performance_observation \
            --manifest-path control/Cargo.toml
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" \
            cargo build --locked --release --example performance_observation \
            --manifest-path candidate/Cargo.toml
          python3 candidate/tools/performance_contract.py collect-pair \
            --repository remote-protocol \
            --control-revision "$CONTROL_REVISION" \
            --candidate-revision "$CANDIDATE_REVISION" \
            --scenario protocol-error-envelope-v1 \
            --tier "$PERFORMANCE_TIER" \
            --runner-class github-ubuntu-24.04-x64 \
            --toolchain rust-1.97.1 \
            --iterations "$PERFORMANCE_ITERATIONS" --warmups 1 --timeout-seconds 30 \
            --control-output "$RUNNER_TEMP/control-performance.json" \
            --candidate-output "$RUNNER_TEMP/candidate-performance.json" \
            -- "$RUNNER_TEMP/control-target/release/examples/performance_observation" \
            ::: "$RUNNER_TEMP/candidate-target/release/examples/performance_observation"
          python3 candidate/tools/performance_contract.py compare \
            "$RUNNER_TEMP/control-performance.json" \
            "$RUNNER_TEMP/candidate-performance.json" \
            "candidate/$PERFORMANCE_POLICY" \
            --output "$RUNNER_TEMP/performance-comparison.json"
      - name: Upload bounded performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-performance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/control-performance.json
            ${{ runner.temp }}/candidate-performance.json
            ${{ runner.temp }}/performance-comparison.json
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / Required
    if: always()
    needs:
      - dependency-review
      - automation
      - macos-quality
      - performance-smoke
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          MACOS_QUALITY_RESULT: ${{ needs.macos-quality.result }}
          PERFORMANCE_SMOKE_RESULT: ${{ needs.performance-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          [[ "$AUTOMATION_RESULT" == success ]] || {
            echo "Automation must succeed, got: $AUTOMATION_RESULT" >&2
            exit 1
          }
          [[ "$QUALITY_RESULT" == success ]] || {
            echo "Quality must succeed, got: $QUALITY_RESULT" >&2
            exit 1
          }
          [[ "$MACOS_QUALITY_RESULT" == success ]] || {
            echo "macOS quality must succeed, got: $MACOS_QUALITY_RESULT" >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push ]]; then
            [[ "$PERFORMANCE_SMOKE_RESULT" == success ]] || {
              echo "Performance smoke must succeed, got: $PERFORMANCE_SMOKE_RESULT" >&2
              exit 1
            }
          else
            [[ "$PERFORMANCE_SMOKE_RESULT" == skipped ]] || {
              echo "Performance smoke must be skipped outside pull requests and main pushes, got: $PERFORMANCE_SMOKE_RESULT" >&2
              exit 1
            }
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == success ]] || {
              echo "Dependency review must succeed, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          else
            [[ "$DEPENDENCY_REVIEW_RESULT" == skipped ]] || {
              echo "Dependency review must be skipped outside pull requests, got: $DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            }
          fi
